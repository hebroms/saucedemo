name: Playwright CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
    - name: Install Dependencies
      run: npm ci
    - name: Run Playwright Tests
      # Rule 2: Running tests. Playwright handles parallel execution by default.
      run: npx playwright test
    - name: Generate and Upload Report Artifacts
      # Rule 3: Generate HTML report and upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-${{ github.run_id }}
        path: playwright-report
        retention-days: 7