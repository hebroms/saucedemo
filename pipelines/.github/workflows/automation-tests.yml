name: Playwright Tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install

    - name: Run Playwright Tests and Generate Report
      id: playwright_run
      # The command runs tests. Playwright automatically generates reports based on its configuration (which we assume exists in playwright.config.js)
      # We ensure the report directory is created/used as specified.
      run: npx playwright test --project=chromium --output=./playwright-report

    - name: Upload Test Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-${{ github.run_id }}
        path: playwright-report/

artifacts:
  outputs:
    report_path: playwright-report/