name: Playwright E2E Tests
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install

    - name: Run Playwright Tests and Generate Reports
      id: playwright_run
      # Playwright automatically generates reports in the project root or specified locations.
      # We run the test command, which handles parallel execution internally.
      run: npx playwright test --reporter=html --output-dir=playwright-report

    - name: Archive Test Artifacts
      uses: actions/upload-artifact@v4
      if: always() # Rule: On failure: always save artifacts
      with:
        name: playwright-report-${{ github.run_id }}
        path: playwright-report/

    - name: Upload Screenshots and Traces (Optional but recommended for full coverage)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-screenshots-${{ github.run_id }}
        path: playwright-report/screenshots/

    - name: Upload Trace Files (If generated by Playwright)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-traces-${{ github.run_id }}
        path: playwright-report/traces/