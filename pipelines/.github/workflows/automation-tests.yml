name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install

    - name: Run Playwright Tests and Generate Report
      id: playwright_run
      # Ensure the report directory exists before running tests, as per requirement
      run: |
        mkdir -p playwright-report
        npx playwright test --reporter=html --output playwright-report/report.html
      env:
        BASE_URL: ${{ secrets.BASE_URL }}
        USERNAME: ${{ secrets.USERNAME }}
        PASSWORD: ${{ secrets.PASSWORD }}

    - name: Upload Playwright Report Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-${{ github.run_id }}
        path: playwright-report/

artifacts:
  outputs:
    report_path: playwright-report/report.html
runs-on: ubuntu-latest