name: playwright-e2e-tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Playwright tests and generate reports
        id: playwright_run
        # Playwright automatically generates reports in the default location, 
        # but we ensure the command runs.
        run: npx playwright test --project=chromium --reporter=html --outputDir=playwright-report

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always() # Ensures artifacts are uploaded even if the previous step failed
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/

artifacts:
  name: playwright-reports
  paths:
    - playwright-report/**
  retention-days: 30