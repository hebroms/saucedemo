name: Playwright CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install dependencies
      run: npm install

    - name: Install Playwright Browsers
      run: npx playwright install

    - name: Run Playwright Tests and Generate Report
      id: playwright_run
      run: |
        # Ensure the report directory exists before running tests, as specified
        mkdir -p playwright-report
        
        # Execute the test command. We assume the playwright config handles environment loading if necessary.
        npx playwright test --reporter=html --output playwright-report
        
    - name: Upload Playwright Report Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-${{ github.run_id }}
        path: playwright-report
        retention-days: 7